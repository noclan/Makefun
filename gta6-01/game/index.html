<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR — Streets of Gold</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #14121f; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
  canvas { width: min(1280px, 100vw); height: auto; aspect-ratio: 16 / 9; max-height: calc(100vh - 64px); max-width: calc((100vh - 64px) * 16 / 9); background: #1d6d84; display: block; }
  #status { color: #ffd9a0; font-size: 14px; padding: 8px 12px; text-align: center; }
  #help { color: #9aa3b2; font-size: 12px; padding: 0 12px 8px; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="status">SOLMAR — loading…</div>
  <div id="help">WASD move / drive &nbsp;•&nbsp; E enter or steal a car &nbsp;•&nbsp; F punch &nbsp;•&nbsp; Click to shoot &nbsp;•&nbsp; N next mission &nbsp;•&nbsp; P pause &nbsp;•&nbsp; M mute</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
